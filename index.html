<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon: emblema del cuervo (Crow Comics) -->
    <link rel="icon" type="image/png" sizes="any" href="/crow-emblem.png" />
    <link rel="apple-touch-icon" href="/crow-emblem.png" />
    <link rel="shortcut icon" type="image/png" href="/crow-emblem.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>Crow Comics — Directorio & Maquetaciones</title>
    <!-- Tema persistido: se aplica ANTES del primer pintado para evitar parpadeo -->
    <script>
      try {
        var t = localStorage.getItem('crow_theme');
        var h = localStorage.getItem('crow_accent_hue');
        document.documentElement.dataset.theme = (t === 'light' || t === 'dark') ? t : 'dark';
        if (h && Number(h) >= 0 && Number(h) <= 360) {
          document.documentElement.style.setProperty('--crow-hue', h);
        }
      } catch (e) {}
    </script>
  </head>
  <body class="font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
